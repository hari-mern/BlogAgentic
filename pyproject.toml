[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hari-velo", email = "harikrishna@velocioussolutions.in" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.6",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.2",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "python-dotenv>=1.2.3",
    "streamlit>=1.61.1",
    "tavily-python>=0.7.27",
    "uvicorn>=0.52.3",
    "watchdog>=6.0.0",
]

[project.scripts]
blogagentic = "blogagentic:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
